re a notary public), September 30, 2020, submitted as defense evidence in The Government of the United States of America v. Julian Paul Assange, Central Criminal Court (Old Bailey), London."}, {"number": 985, "word_id": "986", "html": "<em>Convention Relating to the Status of Refugees</em>, July 28, 1951, art. 34, <a href=\"https://www.unhcr.org/1951-refugee-convention.html?utm_source=gemini\">https://www.unhcr.org/1951-refugee-convention.html</a> (\"The Contracting States shall as far as possible facilitate the assimilation and naturalization of refugees. They shall in particular make every effort to expedite naturalization proceedings and to reduce as far as possible the charges and costs of such proceedings.\").", "plain": "Convention Relating to the Status of Refugees, July 28, 1951, art. 34, https://www.unhcr.org/1951-refugee-convention.html (\"The Contracting States shall as far as possible facilitate the assimilation and naturalization of refugees. They shall in particular make every effort to expedite naturalization proceedings and to reduce as far as possible the charges and costs of such proceedings.\")."}, {"number": 986, "word_id": "987", "html": "Ley Orgánica de Movilidad Humana<em> [Organic Law on Human Mobility] (Ecuador), art. 94 (\"The </em><em>Ecuadorian State shall guarantee the confidentiality of the data of persons subject to international </em><em>protection in accordance with the provisions of current legislation and international instruments\"</em><em>); </em>Reglamento a la Ley Orgánica de Movilidad Humana<em> [Regulations to the Organic Law on Human Mobility] (Ecuador), art. 78 (\"Every refugee and applicant for such status has the right to the protection and confidentiality of their personal data</em><em> and of the information they have provided in the framework of the refugee status determination procedure and the search for durable solutions. Confidentiality shall be respected during all stages of the procedure, and the obligation shall extend to all persons or institutions participating directly or indirectly</em><em>.\").</em>", "plain": "Ley Orgánica de Movilidad Humana [Organic Law on Human Mobility] (Ecuador), art. 94 (\"The Ecuadorian State shall guarantee the confidentiality of the data of persons subject to international protection in accordance with the provisions of current legislation and international instruments\"); Reglamento a la Ley Orgánica de Movilidad Humana [Regulations to the Organic Law on Human Mobility] (Ecuador), art. 78 (\"Every refugee and applicant for such status has the right to the protection and confidentiality of their personal data and of the information they have provided in the framework of the refugee status determination procedure and the search for durable solutions. Confidentiality shall be respected during all stages of the procedure, and the obligation shall extend to all persons or institutions participating directly or indirectly.\")."}, {"number": 987, "word_id": "988", "html": "Foreign, Commonwealth &amp; Development Office. \"Foreign Secretary affords Nazanin Zaghari-Ratcliffe diplomatic protection\", March 8, 2019, <a href=\"https://www.gov.uk/government/news/foreign-secretary-affords-nazanin-zaghari-ratcliffe-diplomatic-protection\">https://www.gov.uk/government/news/foreign-secretary-affords-nazanin-zaghari-ratcliffe-diplomatic-protection</a>", "plain": "Foreign, Commonwealth &amp; Development Office. \"Foreign Secretary affords Nazanin Zaghari-Ratcliffe diplomatic protection\", March 8, 2019, https://www.gov.uk/government/news/foreign-secretary-affords-nazanin-zaghari-ratcliffe-diplomatic-protection"}, {"number": 988, "word_id": "989", "html": "Akande, Dapo. \"Ecuador Seeks to Confer Diplomatic Status on Julian Assange: Does this Oblige the UK to Allow Him to Leave the Embassy &amp; Is the Matter Headed to the ICJ?\", January 25, 2018,  <a href=\"https://www.ejiltalk.org/does-ecuadors-appointment-of-julian-assange-oblige-the-uk-to-allow-him-to-lea const list = document.getElementById('list');
const emptyEl = document.getElementById('empty');
const countLine = document.getElementById('count-line');
const searchEl = document.getElementById('search');
const jumpEl = document.getElementById('jump');

function render(filter){
  list.innerHTML = '';
  const f = (filter || '').trim().toLowerCase();
  let shown = 0;
  const frag = document.createDocumentFragment();
  for (const n of NOTES){
    if (f && !n.plain.toLowerCase().includes(f) && String(n.number) !== f) continue;
    shown++;
    const row = document.createElement('div');
    row.className = 'note';
    row.id = 'n' + n.number;
    row.innerHTML = '<div class="num">' + n.number + '</div><div class="txt">' + n.html + '</div>';
    frag.appendChild(row);
  }
  list.appendChild(frag);
  emptyEl.style.display = shown === 0 ? 'block' : 'none';
  countLine.textContent = f ? ('Showing ' + shown.toLocaleString() + ' of 1,315 notes') : ('Showing all ' + NOTES.length.toLocaleString() + ' notes');
}

searchEl.addEventListener('input', () => render(searchEl.value));

jumpEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter'){
    const num = jumpEl.value.trim();
    if (!num) return;
    searchEl.value = '';
    render('');
    const el = document.getElementById('n' + num);
    if (el){
      el.scrollIntoView({behavior:'smooth', block:'start'});
      el.classList.add('hit');
      setTimeout(() => el.classList.remove('hit'), 1600);
    }
  }
});

render('');
</script>
